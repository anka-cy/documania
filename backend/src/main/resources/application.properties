spring.application.name=documania-backend

# Dev local : charge backend/.env (ignoré par Git) comme source de valeurs.
# Les variables d'environnement réelles restent prioritaires.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Derrière le proxy TLS d'Azure Container Apps : Spring doit honorer les
# en-têtes X-Forwarded-* pour que request.isSecure() reflète le HTTPS réel
# (cookie de rafraîchissement émis avec l'attribut Secure).
server.forward-headers-strategy=framework

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.properties.hibernate.type.json_format_mapper=com.documania.backend.config.HibernateJsonFormatMapper

spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:smtp.azurecomm.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

app.mail.from=${MAIL_FROM:no-reply@documania.local}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Limites de débit en mémoire (clé IP / IP+email / IP+jeton)
app.security.rate-limit.max-attempts=5
app.security.rate-limit.window=PT10M
app.security.rate-limit.register.max-attempts=20
app.security.rate-limit.register.window=PT1H
app.security.rate-limit.reset.max-attempts=5
app.security.rate-limit.reset.window=PT1H

# Rétention du journal d'audit : purge planifiée des logs au-delà de 90 jours
app.audit.retention-days=90
app.audit.retention.cron=0 0 3 * * SUN

# Purge quotidienne des jetons de rafraîchissement expirés/révoqués (03:30)
app.auth.refresh-token-purge.cron=0 30 3 * * *


# Pièces jointes des tickets : Azure Blob Storage en production (activé),
# stockage local ./uploads sinon (développement / tests).
# En production, privilégier l'identité managée : définir AZURE_STORAGE_BLOB_ENDPOINT
# (+ AZURE_CLIENT_ID optionnel) et laisser AZURE_STORAGE_CONNECTION_STRING vide.
# La connection-string n'est gardée qu'en repli éventuel.
app.storage.blob.enabled=${AZURE_STORAGE_BLOB_ENABLED:false}
app.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.storage.blob.client-id=${AZURE_CLIENT_ID:}
app.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
