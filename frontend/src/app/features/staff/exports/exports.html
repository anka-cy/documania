<section class="py-3">
  <h1 class="h3 mb-4">Exports</h1>
  <div id="exports-content">
    <div class="row g-3">
      @for (entry of exportTypes; track entry.key) {
        <div class="col-md-6 col-xl-4">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="bi {{ entry.icon }}" aria-hidden="true"></i>
                <h2 class="h5 mb-0">{{ entry.label }}</h2>
              </div>
              <p class="text-muted small mb-3">{{ entry.description }}</p>
              <div class="d-flex gap-2 mt-auto">
                <button
                  class="btn btn-sm btn-primary export-btn"
                  [attr.data-type]="entry.key"
                  [disabled]="busyType() === entry.key"
                  (click)="onExport(entry.key)"
                >
                  @if (busyType() === entry.key) {
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Préparation…
                  } @else {
                    <i class="bi bi-file-earmark-excel me-1"></i>Télécharger Excel (.xlsx)
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
