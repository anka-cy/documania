<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documania — Espace client</title>
  <meta name="description" content="Portails client et staff de gestion des services, offres, commandes et abonnements." />
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />

  <!--
    Bootstrap 5.3 (CDN) : base utilitaire approuvée (D-018). Chargé AVANT
    app.css pour que les variables CSS du thème personnalise Bootstrap.
  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons (CDN) : icônes du même écosystème que Bootstrap. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />

  <!-- Feuille de style globale (variables, reset, layout, composants) :
       compilée via angular.json > styles (public/assets/styles/app.css). -->
</head>
<body>

  <!-- Le SPA entier (layouts, vues, gardes de route) est rendu par Angular. -->
  <app-root class="d-flex flex-column min-vh-100"></app-root>

  <!-- Bootstrap JS : nécessaire aux modales et toasts. -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
